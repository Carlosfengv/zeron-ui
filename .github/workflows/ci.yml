name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Semantic tokens are up to date
        run: pnpm tokens:check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Test CLI
        run: pnpm cli:test

      - name: Build
        run: pnpm build

      # Rebuild the registry and fail if the committed public/r output has
      # drifted from the sources — public/r is what users install from.
      - name: Registry output is up to date
        run: |
          pnpm registry:build
          git diff --exit-code -- public/r || {
            echo "::error::public/r is stale — run 'pnpm registry:build' and commit the result"
            exit 1
          }
