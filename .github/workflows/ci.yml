name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
      clean: ${{ steps.scope.outputs.clean }}
      consumers: ${{ steps.scope.outputs.consumers }}
      migrations: ${{ steps.scope.outputs.migrations }}
      e2e: ${{ steps.scope.outputs.e2e }}
      suites: ${{ steps.scope.outputs.suites }}
      consumer-matrix: ${{ steps.scope.outputs.consumer-matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Classify changed paths
        id: scope
        run: node scripts/ci-changes.mjs

  quality:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace

      - name: Install test browser for rendered controls
        run: pnpm exec playwright install --with-deps chromium

      - name: Semantic tokens are up to date
        run: pnpm tokens:check

      - name: Committed route and guide mappings are up to date
        run: pnpm docs:routes:check && pnpm docs:sources:check && pnpm agents:guides:check

      - name: Build code engine inputs
        run: pnpm code-engine:build

      - name: Typecheck maintained Agent guide examples
        run: pnpm agents:guides:examples:check

      - name: Bundle paired migration skills
        run: pnpm skills:bundle

      - name: Build public skill downloads
        run: pnpm skills:build

      - name: Verify isolated Skill release candidate
        run: pnpm skills:release:check

      - name: Upload Skill candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-candidate-evidence
          path: |
            output/agent-access/skill-candidate.json
            output/agent-access/skill-candidate-artifacts.json
            output/agent-access/skill-candidate-manifest.json
            output/agent-access/skill-publication-plan.json
          if-no-files-found: ignore

      - name: Typecheck public source packages
        run: pnpm --filter @zeron/ui typecheck && pnpm --filter @zeron/blocks typecheck

      # Rebuild the registry and fail if the committed public/r output has
      # drifted from the sources — public/r is what users install from.
      - name: Registry output is up to date
        run: |
          pnpm registry:build
          git diff --exit-code -- public/r || {
            echo "::error::public/r is stale — run 'pnpm registry:build' and commit the result"
            exit 1
          }
          test -z "$(git ls-files --others --exclude-standard public/r)" || {
            echo "::error::public/r contains generated files that are not committed"
            exit 1
          }

      - name: Validate Registry closure
        run: pnpm registry:check

      - name: Verify isolated Registry candidate and retry behavior
        run: pnpm registry:release:check

      - name: Upload Registry candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-candidate-evidence
          path: |
            output/agent-access/registry-candidate.json
            output/agent-access/registry-candidate-manifest.json
            output/agent-access/registry-publication-plan.json
          if-no-files-found: ignore

      # These directories are ignored and absent in a fresh checkout. Validate
      # committed generated text first, then materialize runtime JSON before
      # lint, typechecking, or tests import the MCP route.
      - name: Agent data and committed context are up to date
        run: pnpm agents:check

      - name: Build development Agent runtime
        run: pnpm agents:build --mode development

      - name: Lint
        run: pnpm lint

      - name: Design lint
        run: pnpm lint:design

      - name: Typecheck application and tests
        run: pnpm typecheck

      - name: Test source modules and MCP protocol
        run: pnpm test:unit

      - name: Test rendered controls in an isolated Chromium process
        run: pnpm test:controls:browser

      - name: Test CLI
        run: pnpm cli:test

  consumers:
    name: consumers (${{ matrix.group }})
    needs: changes
    if: needs.changes.outputs.consumers == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.consumer-matrix) }}
    env:
      ZERON_CONSUMER_PACKAGE_MANAGERS: ${{ matrix.next-managers }}
      ZERON_VITE_CONSUMER_PACKAGE_MANAGERS: ${{ matrix.vite-managers }}
      ZERON_CONSUMER_COMPONENTS: ${{ matrix.next-components || 'button,card,ask-user-questions,code-block,infinite-log-table-01' }}
      ZERON_VITE_CONSUMER_COMPONENTS: ${{ matrix.vite-components || 'button,card,ask-user-questions,code-block' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Prepare code engine inputs
        run: pnpm code-engine:build
      - name: Install test browser
        if: matrix.styles
        run: pnpm exec playwright install --with-deps chromium
      - name: Install representative consumers
        run: pnpm test:consumer:smoke

      - name: Verify initialized consumer styles in browser
        if: matrix.styles
        run: pnpm test:consumer:styles

      - name: Upload consumer style evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-style-evidence-${{ matrix.group }}
          path: output/consumer-styles
          retention-days: 14
          if-no-files-found: ignore

  migrations:
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Prepare code engine inputs
        run: pnpm code-engine:build
      - name: Install test browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Migrate representative consumers
        run: pnpm test:consumer:migrations

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-evidence
          path: output/swap-validation
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    env:
      ZERON_E2E_SUITES: ${{ needs.changes.outputs.suites }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Prepare code engine inputs
        run: pnpm code-engine:build
      - name: Install test browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Restore Next build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build
        id: build
        run: pnpm test:e2e:build

      - name: Verify production documentation and MCP HTTP routes
        run: pnpm test:production

      - name: Test production browser suites in Chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm test:e2e:run

      - name: Upload E2E reports and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-pr-evidence
          path: output/e2e/pr
          retention-days: 14
          if-no-files-found: ignore

  agent-clean-checkout:
    needs: changes
    if: needs.changes.outputs.clean == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      # Full quality, consumer and browser checks already have isolated jobs.
      # Here only prove that absent generated inputs can be bootstrapped.
      - name: Verify fresh Agent bootstrap
        run: pnpm agents:verify:clean --bootstrap
      - name: Upload clean checkout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-clean-checkout-evidence
          path: output/agent-clean
          retention-days: 14
          if-no-files-found: error

  # Preserve the existing required check, including documentation-only runs.
  checks:
    needs: [changes, quality, consumers, migrations, e2e, agent-clean-checkout]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require successful results for the selected scope
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/check-ci-results.mjs
