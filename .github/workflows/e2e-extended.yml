name: Extended E2E

on:
  workflow_dispatch:
  schedule:
    # 02:00 Asia/Shanghai on the following calendar day.
    - cron: '0 18 * * *'

permissions:
  contents: read

concurrency:
  group: e2e-extended-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Check committed generated inputs
        run: pnpm tokens:check && pnpm docs:routes:check && pnpm docs:sources:check && pnpm agents:guides:check
      - name: Prepare code engine inputs
        run: pnpm code-engine:build
      - name: Restore Next build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build once and record source inputs
        id: build
        run: pnpm test:e2e:build
      - name: Run all existing browser projects
        run: pnpm test:e2e:full:run
      - name: Upload E2E reports and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-evidence-${{ github.sha }}
          path: output/e2e/full
          retention-days: 14
          if-no-files-found: ignore

  agent-clean-checkout:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Install browser runner
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify fresh isolated Agent checkout
        run: pnpm agents:verify:clean
      - name: Upload clean checkout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-clean-checkout-evidence
          path: output/agent-clean
          retention-days: 14
          if-no-files-found: error
