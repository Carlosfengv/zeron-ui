name: Agent release validation

on:
  workflow_dispatch:
    inputs:
      registry_release_id:
        description: Existing public Registry release generated from this exact content commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: agent-release-validation-${{ inputs.registry_release_id }}
  cancel-in-progress: false

env:
  ARTIFACT_BASE_URL: ${{ vars.ARTIFACT_BASE_URL }}
  SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}

jobs:
  prepare:
    name: Prepare published installation input
    if: github.repository == 'Carlosfengv/zeron-ui' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.input-artifact.outputs.artifact-id }}
      input-sha256: ${{ steps.prepare.outputs.input-sha256 }}
      input-bytes: ${{ steps.prepare.outputs.input-bytes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install exact package managers and locked workspace dependencies
        run: |
          npm install --global npm@10.9.2
          pnpm install --frozen-lockfile
      - name: Build ignored code engine inputs
        run: pnpm code-engine:build
      - name: Prepare fixed source and public completion input
        id: prepare
        env:
          REGISTRY_RELEASE_ID: ${{ inputs.registry_release_id }}
        run: node scripts/prepare-agent-ci-input.mjs --release-id "$REGISTRY_RELEASE_ID" --output "$RUNNER_TEMP/agent-ci-prepare"
      - name: Upload installation input
        id: input-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-installation-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.prepare.outputs.input-file }}
          if-no-files-found: error
          retention-days: 90

  consumer:
    name: Published consumers
    needs: prepare
    environment: agent-artifact-publication
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install exact package managers and locked workspace dependencies
        run: |
          npm install --global npm@10.9.2
          pnpm install --frozen-lockfile
      - name: Build ignored code engine inputs
        run: pnpm code-engine:build
      - name: Download this attempt's prepared input by artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: ${{ runner.temp }}/agent-input
          merge-multiple: true
      - name: Verify installation input transport bytes
        env:
          INPUT_SHA256: ${{ needs.prepare.outputs.input-sha256 }}
          INPUT_BYTES: ${{ needs.prepare.outputs.input-bytes }}
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const bytes=await readFile(`${process.env.RUNNER_TEMP}/agent-input/installation-input.json`);
          if(bytes.length>2*1024*1024 || bytes.length!==Number(process.env.INPUT_BYTES) || createHash('sha256').update(bytes).digest('hex')!==process.env.INPUT_SHA256) throw new Error('CI_INPUT_TRANSPORT_BYTES');
          JS
      - name: Verify published consumers
        id: execute
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.AGENT_BLOB_TOKEN }}
        run: pnpm test:consumer:published --input "$RUNNER_TEMP/agent-input/installation-input.json" --output "$RUNNER_TEMP/consumer-evidence" --publish-evidence
      - name: Check consumer archive for public upload
        id: archive-check
        if: always()
        timeout-minutes: 5
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.AGENT_BLOB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          EXECUTION_OUTCOME: ${{ steps.execute.outcome }}
        run: node scripts/check-agent-ci-archive.mjs --input "$RUNNER_TEMP/agent-input/installation-input.json" --directory "$RUNNER_TEMP/consumer-evidence" --stage "$RUNNER_TEMP/consumer-public-archive" --role consumer --outcome "$EXECUTION_OUTCOME"
      # These artifacts are readable by repository readers, including public-repository users.
      - name: Upload consumer evidence
        if: always() && steps.archive-check.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-consumer-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/consumer-public-archive
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  examples:
    name: Published examples
    needs: prepare
    environment: agent-artifact-publication
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install exact package managers and locked workspace dependencies
        run: |
          npm install --global npm@10.9.2
          pnpm install --frozen-lockfile
      - name: Build ignored code engine inputs
        run: pnpm code-engine:build
      - name: Install locked Chromium and Linux browser dependencies
        run: pnpm exec playwright install --with-deps chromium-headless-shell
      - name: Download this attempt's prepared input by artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: ${{ runner.temp }}/agent-input
          merge-multiple: true
      - name: Verify installation input transport bytes
        env:
          INPUT_SHA256: ${{ needs.prepare.outputs.input-sha256 }}
          INPUT_BYTES: ${{ needs.prepare.outputs.input-bytes }}
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const bytes=await readFile(`${process.env.RUNNER_TEMP}/agent-input/installation-input.json`);
          if(bytes.length>2*1024*1024 || bytes.length!==Number(process.env.INPUT_BYTES) || createHash('sha256').update(bytes).digest('hex')!==process.env.INPUT_SHA256) throw new Error('CI_INPUT_TRANSPORT_BYTES');
          JS
      - name: Verify published examples
        id: execute
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.AGENT_BLOB_TOKEN }}
        run: pnpm test:examples:published --input "$RUNNER_TEMP/agent-input/installation-input.json" --output "$RUNNER_TEMP/example-evidence" --publish-evidence
      - name: Check example archive for public upload
        id: archive-check
        if: always()
        timeout-minutes: 5
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.AGENT_BLOB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          EXECUTION_OUTCOME: ${{ steps.execute.outcome }}
        run: node scripts/check-agent-ci-archive.mjs --input "$RUNNER_TEMP/agent-input/installation-input.json" --directory "$RUNNER_TEMP/example-evidence" --stage "$RUNNER_TEMP/example-public-archive" --role examples --outcome "$EXECUTION_OUTCOME"
      - name: Upload example evidence
        if: always() && steps.archive-check.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-example-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/example-public-archive
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
