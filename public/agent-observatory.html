function dashboard(listOnly=false){const sum=sessions.reduce((a,s)=>a+sums(s).tokens,0);return `<div class="pagehead"><div><div class="eyebrow">OBSERVE / UNDERSTAND / TRACE</div><h1>${listOnly?'所有 Sessions':'执行概览'}</h1><p class="subtitle">${listOnly?'找到一次执行，从消息追踪到每个工具调用。':'关注正在发生的执行，以及需要你介入的地方。'}</p></div><div class="actions"><span style="font-size:11px;color:var(--muted)">09.07 — 09.08, 2026</span><button class="btn" data-action="export-all">${icon('download')}导出记录</button></div></div>${listOnly?'':`<div class="metrics">${metric('会话总数','6','2 次执行结束 · 1 次已取消')}${metric('当前执行中','1','正在整理组件使用文档')}${metric('需要关注','2','1 次等待确认 · 1 次执行失败')}${metric('累计 Token',compact(sum),'包含子 Agent · 按模型调用逐条累加')}</div><div class="overview-grid"><section class="panel"><div class="panel-heading"><h2>会话活动</h2><span>按开始时间分组 · 单位：次</span></div><div class="activity-chart">${[['09/07',sessions.filter(s=>s.date==='2026-09-07')],['09/08',sessions.filter(s=>s.date==='2026-09-08')]].map(([d,ss])=>`<div class="activity-row"><span>${d}</span><div class="activity-track">${ss.map(s=>`<button class="activity-block ${s.status}" data-session="${s.id}" style="width:24%" title="${esc(s.title)} · ${statusNames[s.status]}" aria-label="查看${esc(s.title)}"></button>`).join('')}</div><span>${ss.length}</span></div>`).join('')}<div class="chart-axis"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span></div><div class="legend" style="margin-top:18px"><span><i style="background:#a0b7a0"></i>结束</span><span><i style="background:#6c90b2"></i>执行中</span><span><i style="background:#d8ae68"></i>等待</span><span><i style="background:#ce817a"></i>失败</span><span><i style="background:#b7bdb5"></i>取消</span></div></div></section><section class="panel"><div class="panel-heading"><h2>需要关注 <span style="margin-left:5px">02</span></h2><span>点击查看原因</span></div><button class="attention-row" data-session="ses_02ab"><span class="attention-symbol">${icon('clock')}</span><div><strong>通知偏好更新 · 等待确认</strong><p>需要确认通知渠道，已等待 14 分钟</p></div><span class="chev">${icon('chev')}</span></button><button class="attention-row" data-session="ses_9d04"><span class="attention-symbol red">${icon('info')}</span><div><strong>API 环境检查 · 执行失败</strong><p>环境凭据缺失 · HTTP 401 · 尚未恢复</p></div><span class="chev">${icon('chev')}</span></button></section></div>`}<div class="sectionhead"><h2>${listOnly?'会话记录':'最近会话'}<small>6 个模拟会话</small></h2>${listOnly?'':`<a href="#sessions" class="mini-link">查看所有 Sessions ↗</a>`}</div>${sessionTable()}<div class="footer"><span>数据快照 · 2026-09-08 10:30:00 UTC+8</span><a href="#definitions">查看统计口径与层级定义 ↗</a></div>`;}
function traceToolbar(){return `<div class="toolbar"><label class="search">${icon('search')}<input id="trace-search" type="search" placeholder="搜索消息、工具或返回内容…" aria-label="搜索执行记录" value="${esc(traceFilter.query)}"></label><select id="trace-agent" aria-label="筛选 Agent"><option value="all">全部 Agent</option>${[...new Set(records(currentSession()).messages.map(m=>m.agent).filter(a=>a!=='user'))].map(a=>`<option value="${a}" ${traceFilter.agent===a?'selected':''}>${agentName(a)}</option>`).join('')}</select><select id="trace-status" aria-label="工具调用状态"><option value="all">全部调用状态</option><option value="failed" ${traceFilter.status==='failed'?'selected':''}>失败调用</option><option value="success" ${traceFilter.status==='success'?'selected':''}>成功调用</option></select></div>`;}
function trace(s){const x=sums(s);const waiting=s.status==='waiting',failed=s.status==='failed';return `<a class="back" href="#sessions">${icon('back')}返回 Sessions</a><div class="pagehead trace-head"><div><div class="trace-title"><h1>${esc(s.title)}</h1>${badge(s.status)}</div><div class="trace-meta"><span class="id" style="margin:0">${s.id}</span><span>${s.model}</span><span>${s.date} ${s.start} UTC+8</span><span>来源：交互模拟</span></div></div><button class="btn" data-action="export-session">${icon('download')}导出 Trace</button></div>${waiting||failed?`<div class="notice-strip ${failed?'failed':''}">${icon('info')}<span>${waiting?'等待原因：需要用户确认是否将重要通知同步至邮件。已等待 14 分钟。':'停止原因：测试环境缺少有效凭据，HTTP 401。未记录恢复调用。'}</span><button class="btn small" data-action="show-last">查看${waiting?'等待消息':'失败调用'}</button></div>`:''}${s.status==='running'?'<div class="notice-strip" style="background:var(--blue-soft);color:var(--blue);border-color:#d8e4ef">● 正在整理组件参数 · 最近活动距快照 12 秒。本页为固定快照，不模拟真实实时连接。</div>':''}<div class="metrics trace-metrics">${metric('会话持续时间',duration(s.elapsed),s.status==='waiting'?'包含等待用户的时间':'起始至结束 / 当前快照')}${metric('Messages',x.messages,'用户与各 Agent 消息合计')}${metric('工具调用',x.tools,x.success+' 成功 · '+x.fail+' 失败'+(s.status==='running'?' · 1 执行中':''))}${metric('累计 Token',compact(x.tokens),'包含子 Agent · 每次调用只计一次')}${metric('子 Agent',x.agents,'不含主 Agent')}</div><div class="tabs" role="tablist" aria-label="执行视图">${[['timeline','执行时间线',''],['messages','Messages',x.messages],['tools','工具调用',x.tools],['agents','子 Agent',x.agents],['resources','资源与耗时','']].map(([key,label,n])=>`<button role="tab" aria-selected="${currentTab===key}" class="tab ${currentTab===key?'active':''}" data-tab="${key}">${label}${n!==''?`<span>${n}</span>`:''}</button>`).join('')}</div><div id="trace-view">${traceContent(s)}</div><div class="footer"><span>Session → Message → Tool call · 子 Agent 通过委派关系关联</span><a href="#definitions">指标口径 ↗</a></div>`;}
function matchesTool(t){return (traceFilter.agent==='all'||t.agent===traceFilter.agent)&&(traceFilter.status==='all'||t.status===traceFilter.status)&&(!traceFilter.query||JSON.stringify(t).toLowerCase().includes(traceFilter.query.toLowerCase()));}
function visibleMessages(s){const r=records(s);return r.messages.filter(m=>(traceFilter.agent==='all'||m.agent===traceFilter.agent)&&(traceFilter.status==='all'||r.tools.some(t=>t.message===m.id&&t.status===traceFilter.status))&&(!traceFilter.query||JSON.stringify(m).toLowerCase().includes(traceFilter.query.toLowerCase())||r.tools.some(t=>t.message===m.id&&JSON.stringify(t).toLowerCase().includes(traceFilter.query.toLowerCase()))));}
function waterfall(s){const r=records(s);const agents=[...new Set(r.messages.filter(m=>m.role!=='user').map(m=>m.agent))];return `<div class="timeline-chart"><div class="timeline-top"><strong style="font-size:11px;color:var(--ink)">执行分布</strong><span>同一时间轴 · 可点击消息区段</span></div><div class="ruler">${[0,.25,.5,.75,1].map(v=>`<span>${stamp(v*s.elapsed)}</span>`).join('')}</div>${agents.map(a=>`<div class="lane"><span class="lane-name">${agentName(a)}</span><div class="lane-track">${r.messages.filter(m=>m.agent===a).map(m=>`<button class="spanbar ${a==='main'?'':'sub'}" style="left:${m.at/s.elapsed*100}%;width:${Math.max(.8,(m.end-m.at)/s.elapsed*100)}%" data-message="${m.id}" aria-label="${m.id} ${esc(m.title)}" title="${m.id} · ${esc(m.title)} · ${duration(m.end-m.at)}"></button>`).join('')}</div></div>`).join('')}<div class="timeline-note">${s.id==='ses_8f2c'?'02:00 两个子 Agent 并行开始 · 08:12 主 Agent 收到结果并继续':'区段表示消息关联的执行跨度，空白不等同于模型推理时间。'}</div></div>`;}
function toolChip(t){return `<button class="tool-chip ${t.status==='failed'?'error-chip':''} ${selected.type==='tool'&&selected.id===t.id?'selected':''}" data-tool="${t.id}">${icon('tool')}<span>${esc(t.name)}</span><span class="tool-duration">${duration(t.duration)}</span>${badge(t.status)}</button>`;}
function timeline(s){const r=records(s),messages=visibleMessages(s);return `<div class="panel">${waterfall(s)}${traceToolbar()}<div class="events">${messages.length?messages.map(m=>{const tools=r.tools.filter(t=>t.message===m.id&&(traceFilter.status==='all'||t.status===traceFilter.status));return `<article class="event"><span class="event-marker ${m.role==='user'?'user-marker':''}">${m.role==='user'?'U':m.agent==='main'?'A':m.agent==='structure'?'01':'02'}</span><div class="event-top"><button data-message="${m.id}">${esc(m.title)}</button><span class="event-time">${stamp(m.at)}${m.end>m.at?' — '+stamp(m.end):''}</span></div><p class="event-text">${esc(m.text)}</p><div class="event-foot"><span>${agentName(m.agent)}</span><span>${m.id}</span>${m.role!=='user'?`<span>${compact(totalToken(m))} Token</span>`:''}${m.id==='M08'?'<span>最终回答</span>':''}</div>${tools.map(toolChip).join('')}${s.id==='ses_8f2c'&&m.id==='M05'?'<div class="retry-note"><span>↳ R01 · 2 次失败 → 修正路径 → 第 3 次构建成功</span><button class="mini-link" data-tool="T09">查看恢复</button></div>':''}</article>`;}).join(''):emptyTrace()}</div></div>`;}
function emptyTrace(){return '<div class="empty"><h3>没有匹配的执行记录</h3><p>调整关键词、Agent 或调用状态。</p><button class="btn" data-action="reset-trace">清除筛选</button></div>';}
function messageState(m,s){if(m.role==='user')return '<span class="badge">已接收</span>';const last=records(s).messages.at(-1);return badge(m.id===last.id?s.status:'ended');}
function messageTable(s){const r=records(s);return `<div class="panel">${traceToolbar()}<div class="table-scroll"><table><thead><tr><th>Message / 内容</th><th>发送方</th><th>执行状态</th><th>执行跨度</th><th>Token</th></tr></thead><tbody>${visibleMessages(s).map(m=>`<tr><td><button class="session-title" data-message="${m.id}">${esc(m.title)}</button><div class="id">${m.id} · ${m.role} · ${r.tools.filter(t=>t.message===m.id).length} 次工具调用</div></td><td>${agentName(m.agent)}</td><td>${messageState(m,s)}</td><td>${duration(m.end-m.at)}</td><td>${m.role==='user'?'—':compact(totalToken(m))}</td></tr>`).join('')}</tbody></table></div>${visibleMessages(s).length?'':emptyTrace()}<div class="table-footer"><span>状态描述消息关联的执行单元；执行跨度含工具等待，并非纯模型生成耗时。</span></div></div>`;}
function toolTable(s){const tools=records(s).tools.filter(matchesTool);return `<div class="panel">${traceToolbar()}<div class="table-scroll"><table><thead><tr><th>工具调用</th><th>状态</th><th>耗时</th><th>所属消息</th></tr></thead><tbody>${tools.map(t=>`<tr><td><button class="session-title" data-tool="${t.id}">${esc(t.name)}</button><div class="id">${t.id} · ${t.type} · ${agentName(t.agent)}</div></td><td>${badge(t.status)}</td><td>${duration(t.duration)}</td><td><button class="mini-link" data-message="${t.message}">${t.message}</button></td></tr>`).join('')}</tbody></table></div>${tools.length?'':emptyTrace()}<div class="table-footer"><span>${tools.length} 条调用记录 · 每次重试单独计数</span></div></div>`;}
function agents(s){const r=records(s);const names=[...new Set(r.messages.filter(m=>!['user','main'].includes(m.agent)).map(m=>m.agent))];return `<div class="panel"><div class="panel-heading"><h2>分工与执行关系</h2><span>消息数、Token 均只计自身</span></div><div class="agent-tree"><div class="agent-root"><div style="display:flex;align-items:center;gap:9px">${icon('branch')}<h3>主 Agent</h3>${badge(s.status)}</div><p class="subtitle">理解请求、委派子任务、整合结果与返回回答</p><div class="agent-stat"><span><b>${r.messages.filter(m=>m.agent==='main').length}</b>Messages</span><span><b>${compact(r.messages.filter(m=>m.agent==='main').reduce((a,m)=>a+totalToken(m),0))}</b>自身 Token</span><span><b>${names.length}</b>子 Agent</span></div><button class="mini-link" data-agent="main">查看主 Agent 的执行 ↗</button></div>${names.length?`<div class="agent-branch">${names.map(a=>{const ms=r.messages.filter(m=>m.agent===a),ts=r.tools.filter(t=>t.agent===a);return `<article class="agent-card"><div style="display:flex;justify-content:space-between;gap:8px"><span class="id">${a==='structure'?'AGENT 01':'AGENT 02'}</span>${badge(s.status==='running'&&a==='builder'?'running':s.status==='failed'&&a==='builder'?'failed':'ended')}</div><h3>${agentName(a)}</h3><p>${s.id==='ses_8f2c'?(a==='structure'?'定位现有组件与数据契约':'实现成员搜索和角色筛选'):esc(ms[0].title)}</p><div class="agent-stat"><span><b>${ts.length}</b>工具调用</span><span><b>${compact(ms.reduce((n,m)=>n+totalToken(m),0))}</b>自身 Token</span></div><p>${stamp(ms[0].at)} → ${stamp(ms.at(-1).end)} · ${ms.length} 条消息</p><button class="btn small" data-agent="${a}">查看执行 ${icon('arrow')}</button></article>`;}).join('')}</div>`:'<div class="empty"><h3>本次没有委派子 Agent</h3><p>所有记录均由主 Agent 产生。</p></div>'}</div><div class="table-footer"><span>子 Agent 的工具调用不是 Agent 之间的委派次数。</span></div></div>`;}
function percentile(a,p){const n=[...a].sort((x,y)=>x-y);return n.length?n[Math.ceil(p*n.length)-1]:0;}
function resources(s){const r=records(s),ms=r.messages.filter(m=>m.role!=='user');const tokenValues=['cached','input','reason','output'].map(k=>ms.reduce((a,m)=>a+m[k],0));const total=tokenValues.reduce((a,n)=>a+n,0);const durations=r.tools.filter(t=>t.status!=='running').map(t=>t.duration);const sum=durations.reduce((a,n)=>a+n,0);return `<div class="resource-grid"><section class="panel"><div class="panel-heading"><h2>Token 构成</h2><span>${fmt(total)} Token</span></div><div class="resource-body"><div class="token-stack" style="height:17px">${tokenValues.map(v=>`<i style="width:${v/total*100}%"></i>`).join('')}</div>${['缓存输入','未缓存输入','推理输出','可见输出'].map((label,i)=>`<div class="resource-row"><span>${label}</span><div class="bar-bg"><div class="bar-fill" style="width:${tokenValues[i]/total*100}%"></div></div><span style="text-align:right">${fmt(tokenValues[i])}</span></div>`).join('')}<p class="metric-note">推理输出与可见输出互不重叠；未提供计费价格，不估算金额。</p></div></section><section class="panel"><div class="panel-heading"><h2>工具调用耗时</h2><span>${durations.length} 次已返回调用</span></div><div class="resource-body"><div style="display:flex;justify-content:space-between;margin:6px 0 17px">${[['P50',percentile(durations,.5)],['P95',percentile(durations,.95)],['最长',Math.max(0,...durations)]].map(([l,n])=>`<div><span class="metric-label">${l}</span><div class="metric-num" style="font-size:25px">${duration(n)}</div></div>`).join('')}</div>${[...new Set(r.tools.map(t=>t.type))].map(type=>{const ts=r.tools.filter(t=>t.type===type&&t.status!=='running');const n=ts.reduce((a,t)=>a+t.duration,0);return `<div class="resource-row"><span>${type} · ${ts.length} 次</span><div class="bar-bg"><div class="bar-fill" style="width:${sum?n/sum*100:0}%"></div></div><span style="text-align:right">${duration(n)}</span></div>`;}).join('')}<p class="metric-note">按工具累计用时；并行时段可重叠，不能作为会话时间占比。</p></div></section><section class="panel"><div class="panel-heading"><h2>工具结果矩阵</h2><span>按调用尝试计数</span></div><div class="table-scroll"><table><thead><tr><th>工具</th><th>成功</th><th>失败</th><th>执行中</th><th>成功率</th></tr></thead><tbody>${[...new Set(r.tools.map(t=>t.type))].map(type=>{const ts=r.tools.filter(t=>t.type===type),ok=ts.filter(t=>t.status==='success').length,failed=ts.filter(t=>t.status==='failed').length;return `<tr><td>${type}</td><td>${ok}</td><td>${failed}</td><td>${ts.length-ok-failed}</td><td>${ok+failed?Math.round(ok/(ok+failed)*100)+'%':'—'}</td></tr>`;}).join('')}</tbody></table></div></section><section class="panel"><div class="panel-heading"><h2>上下文与恢复</h2><span>只展示已采集证据</span></div><div class="resource-body">${s.id==='ses_8f2c'?`<dl class="kv"><dt>主 Agent 峰值</dt><dd>78.4% · 窗口 128,000 Token</dd><dt>压缩事件</dt><dd>1 次 · 10:50 · 主 Agent</dd><dt>压缩前 → 后</dt><dd>100,352 → 36,864 Token</dd><dt>已恢复失败链</dt><dd>1 条 · R01</dd><dt>恢复用时</dt><dd>109.9s · 首次失败返回至成功返回</dd></dl><div class="recovery">2 次构建失败后修正导入路径，第 3 次成功。<br><button data-tool="T06">查看首次失败与恢复链 ↗</button></div>`:'<div class="empty" style="padding:22px 0"><h3>未采集上下文事件</h3><p>无法据此判断是否发生压缩。<br>没有记录不代表占用率为 0。</p></div>'}<p class="metric-note" style="margin-top:15px">窗口占用包含系统提示及工具上下文，与累计输入 Token 是不同口径。</p></div></section></div>`;}
function inspector(s){const r=records(s);const isTool=selected.type==='tool';const item=(isTool?r.tools:r.messages).find(x=>x.id===selected.id);if(!item)return `<aside id="inspector" class="panel inspector"><div class="empty"><h3>查看执行详情</h3><p>选择一条消息或工具调用，<br>查看输入、输出和关联关系。</p></div></aside>`;const main=isTool?`<dl class="kv"><dt>调用 ID</dt><dd class="id" style="margin:0">${item.id}</dd><dt>所属 Message</dt><dd><button data-message="${item.message}">${item.message} ↗</button></dd><dt>执行 Agent</dt><dd><button data-agent="${item.agent}">${agentName(item.agent)} ↗</button></dd><dt>工具类型</dt><dd>${item.type}</dd><dt>相对时间</dt><dd>${stamp(item.at)} → ${stamp(item.at+item.duration)}</dd><dt>耗时</dt><dd>${duration(item.duration)}${item.status==='running'?' · 尚未返回':''}</dd>${item.attempt?`<dt>构建尝试</dt><dd>第 ${item.attempt} / 3 次</dd>`:''}</dl>${item.chain?`<div class="recovery"><strong>R01 · 已恢复</strong><br>首次失败 → 原样重试失败 → 修正路径 → 构建成功。<div style="display:flex;gap:12px;margin-top:8px"><button data-tool="T06">第 1 次</button><button data-tool="T07">第 2 次</button><button data-tool="T09">第 3 次 ↗</button></div></div>`:''}<section class="detail-section"><div class="detail-label">输入参数<button class="btn ghost small" data-action="copy-input" aria-label="复制输入参数">${icon('copy')}</button></div><pre class="code">${esc(JSON.stringify(item.input,null,2))}</pre></section><section class="detail-section"><div class="detail-label">${item.status==='failed'?'错误返回':'返回内容'}</div><pre class="code" ${item.status==='failed'?'style="background:var(--red-soft);color:var(--red)"':''}>${esc(item.output)}</pre></section>`:`<dl class="kv"><dt>Message ID</dt><dd class="id" style="margin:0">${item.id}</dd><dt>消息角色</dt><dd>${item.role}</dd><dt>发送方</dt><dd>${agentName(item.agent)}</dd><dt>执行跨度</dt><dd>${duration(item.end-item.at)}</dd><dt>关联工具</dt><dd>${r.tools.filter(t=>t.message===item.id).length} 次调用</dd><dt>模型</dt><dd>${item.role==='user'?'不适用':s.model}</dd></dl><section class="detail-section"><div class="detail-label">消息内容</div><p class="result-text">${esc(item.text)}</p></section>${item.role!=='user'?`<section class="detail-section"><div class="detail-label">本次模型调用 Token<span>${fmt(totalToken(item))}</span></div><dl class="kv"><dt>缓存输入</dt><dd>${fmt(item.cached)}</dd><dt>未缓存输入</dt><dd>${fmt(item.input)}</dd><dt>推理输出</dt><dd>${fmt(item.reason)}</dd><dt>可见输出</dt><dd>${fmt(item.output)}</dd></dl></section>`:''}<section class="detail-section"><div class="detail-label">关联工具调用</div>${r.tools.filter(t=>t.message===item.id).map(toolChip).join('')||'<p class="result-text">这条消息没有关联工具调用。</p>'}</section>`;return `<aside id="inspector" class="panel inspector"><div class="inspector-header"><div class="inspector-kicker"><span>${isTool?'TOOL CALL':'MESSAGE'} / 详情</span><button class="btn ghost small" data-action="close-detail" aria-label="关闭详情">${icon('close')}</button></div><h2>${esc(isTool?item.name:item.title)}</h2>${isTool?badge(item.status):`<span class="badge">${agentName(item.agent)}</span>`}</div><div class="inspector-body">${main}<div class="detail-section"><details><summary>原始事件 JSON</summary><pre class="code">${esc(JSON.stringify(item,null,2))}</pre></details></div></div></aside>`;}
function traceContent(s){if(currentTab==='resources')return resources(s);if(currentTab==='agents')return agents(s);return `<div class="trace-layout"><div class="trace-left">${currentTab==='timeline'?timeline(s):currentTab==='messages'?messageTable(s):toolTable(s)}</div>${inspector(s)}</div>`;}
function definitions(){const rows=[['Session','用户发起的一次会话执行。包含多条消息、工具调用和可能的子 Agent。本原型不计算目标达成率。'],['Message','一条用户消息或一次模型响应记录。Agent 消息关联工具调用。消息执行跨度包括关联工具等待，不等于纯模型推理耗时。'],['Tool call','每次工具尝试有独立 ID 和父 Message；重试也单独计数。工具返回成功，不代表用户目标已达成。'],['子 Agent','通过委派关联主 Agent；拥有自己的消息与工具。自身 Token 不包含其他 Agent。'],['Token 总量','按模型调用记录汇总：缓存输入 + 未缓存输入 + 推理输出 + 可见输出。后两者互不重叠。包含子 Agent，每条记录只计一次；用户消息不另外加总。'],['工具成功率','成功次数 ÷（成功次数 + 失败次数）。尚未返回的调用不进入分母，失败后恢复也保留原失败记录。'],['恢复链','把具有同一目标的失败、重试与修复关联。恢复用时从首次失败返回计至成功返回；重试次数与失败次数是不同指标。'],['耗时与分位数','Session 是实际墙钟时间；工具累计耗时可以重叠。P50 / P95 对已返回调用使用最近秩法，本原型样本较小。'],['执行状态','执行中、等待确认、执行结束、执行失败、已取消。执行结束仅说明运行终止并返回，不推断验收结果。'],['上下文','按指定 Agent 与模型窗口记录瞬时占用；只有明确的压缩事件才计入压缩次数。未采集显示未知。']];return `<div class="pagehead"><div><div class="eyebrow">A SHARED LANGUAGE</div><h1>指标说明</h1><p class="subtitle">让每个数字有明确的范围、分母和证据。</p></div><a class="btn" href="#overview">返回概览</a></div><section class="panel"><div class="panel-heading"><h2>执行数据的层级与口径</h2><span>Mock v1.0</span></div><table class="definition-table"><tbody>${rows.map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</tbody></table><div class="definitions"><h3>原型边界</h3><p>全部为本地虚构数据，包含执行结束、执行中、等待、失败、取消五种场景。完整示例为「为团队工作台添加成员筛选」，其他会话用于展示状态差异。筛选、查看关联记录和导出均可用；没有连接模型、文件操作、真实会话或计费服务。</p><h3>未采集的数据</h3><p>未提供费用、首 Token 时间、纯模型耗时、目标验收和质量评分，因此不展示推测数值。输入、命令及返回内容是用于展示的文本，不会被执行。</p></div></section>`;}
function currentSession(){const id=location.hash.split('/')[1];return sessions.find(s=>s.id===id)||sessions[0];}
function render(){const route=location.hash.slice(1)||'overview';const isTrace=route.startsWith('session/');let section=isTrace?'sessions':route;document.querySelectorAll('[data-nav]').forEach(a=>{a.classList.toggle('active',a.dataset.nav===section);if(a.dataset.nav===section)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});document.getElementById('crumb').textContent=isTrace?'Sessions / 执行详情':section==='sessions'?'Sessions':section==='definitions'?'指标说明':'执行概览';document.getElementById('view').innerHTML=isTrace?trace(currentSession()):section==='definitions'?definitions():dashboard(section==='sessions');document.querySelectorAll('[role=tab]').forEach(t=>t.tabIndex=t.getAttribute('aria-selected')==='true'?0:-1);const activeTab=document.querySelector('.tab.active');if(activeTab){const container=activeTab.parentElement;if(activeTab.getBoundingClientRect().right>container.getBoundingClientRect().right)container.scrollLeft=activeTab.offsetLeft-container.offsetLeft-container.clientWidth+activeTab.offsetWidth+10;}}
function rerenderTrace(){const el=document.getElementById('trace-view');if(el)el.innerHTML=traceContent(currentSession());}
function selectItem(type,id){selected={type,id};if(['resources','agents'].includes(currentTab)){currentTab=type==='tool'?'tools':'messages';render();}else rerenderTrace();if(innerWidth<=900)document.getElementById('inspector')?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});}
document.addEventListener('click',async e=>{const el=e.target.closest('button,[data-session]');if(!el)return;if(el.dataset.session){selected={type:'tool',id:el.dataset.session==='ses_8f2c'?'T06':'T01'};currentTab='timeline';traceFilter={query:'',status:'all',agent:'all'};location.hash='session/'+el.dataset.session;return;}if(el.dataset.tab){currentTab=el.dataset.tab;render();document.querySelector(`[data-tab="${currentTab}"]`)?.focus({preventScroll:true});return;}if(el.dataset.tool){selectItem('tool',el.dataset.tool);return;}if(el.dataset.message){selectItem('message',el.dataset.message);return;}if(el.dataset.agent){traceFilter={query:'',status:'all',agent:el.dataset.agent};currentTab='messages';selected={type:'message',id:records(currentSession()).messages.find(m=>m.agent===el.dataset.agent)?.id};render();return;}switch(el.dataset.action){case 'reset-sessions':filters={query:'',status:'all',date:'all'};render();break;case 'reset-trace':traceFilter={query:'',status:'all',agent:'all'};rerenderTrace();break;case 'export-all':download({mock:true,snapshot:'2026-09-08T10:30:00+08:00',sessions:filtered().map(s=>({...s,...records(s)}))},'trajectory-sessions.mock.json');break;case 'export-session':{const s=currentSession();download({mock:true,...s,...records(s)},s.id+'.trace.mock.json');break;}case 'close-detail':selected={type:'none',id:''};rerenderTrace();break;case 'show-last':{const s=currentSession(),r=records(s);currentTab=s.status==='failed'?'tools':'messages';selected=s.status==='failed'?{type:'tool',id:r.tools.at(-1).id}:{type:'message',id:r.messages.at(-1).id};render();document.getElementById('inspector')?.scrollIntoView({block:'nearest'});break;}case 'copy-input':{const t=records(currentSession()).tools.find(x=>x.id===selected.id);try{await navigator.clipboard.writeText(JSON.stringify(t.input,null,2));toast('输入参数已复制');}catch{toast('浏览器未允许剪贴板访问，可在参数区域手动复制');}break;}}});
document.addEventListener('input',e=>{if(e.target.id==='session-search'){filters.query=e.target.value;document.getElementById('session-results').innerHTML=sessionRows(filtered());}if(e.target.id==='trace-search'){const value=e.target.value,position=e.target.selectionStart;traceFilter.query=value;rerenderTrace();const input=document.getElementById('trace-search');input.focus({preventScroll:true});if(position!==null)input.setSelectionRange(position,position);}});
document.addEventListener('change',e=>{if(e.target.id==='session-status')filters.status=e.target.value;else if(e.target.id==='session-date')filters.date=e.target.value;else if(e.target.id==='trace-agent'){traceFilter.agent=e.target.value;rerenderTrace();return;}else if(e.target.id==='trace-status'){traceFilter.status=e.target.value;rerenderTrace();return;}else return;document.getElementById('session-results').innerHTML=sessionRows(filtered());});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&location.hash.startsWith('#session/')){selected={type:'none',id:''};rerenderTrace();}if(e.target.matches('[role=tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=['timeline','messages','tools','agents','resources'];let i=tabs.indexOf(currentTab);i=e.key==='Home'?0:e.key==='End'?4:(i+(e.key==='ArrowRight'?1:4))%5;currentTab=tabs[i];render();document.querySelector(`[data-tab="${currentTab}"]`).focus();}});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});render();
</script>
</body>
